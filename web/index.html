<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Muathucoem</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
    overflow-x:hidden;
    overflow-y:auto;
}

body{
    background:#030208;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

#scene{
    position:relative;
    width:100%;
    min-height:135vh;
    height:auto;
    overflow:visible;

    background:
        radial-gradient(
            circle at 50% 45%,
            rgba(100,30,100,.16),
            transparent 45%
        ),
        #030208;
}

#bg-canvas{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    z-index:0;
    pointer-events:none;
}


/* ================= UI ================= */

#ui{
    position:relative;
    z-index:20;

    width:100%;
    min-height:135vh;

    display:flex;
    flex-direction:column;
    align-items:center;

    padding:30px 15px 60px;
    gap:26px;
}


/* ================= AVATAR ================= */

#left-box{
    order:1;

    position:relative;
    isolation:isolate;

    width:min(720px,calc(100% - 10px));
    padding:16px;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    background:rgba(10,8,18,.72);

    border:1px solid rgba(255,170,220,.2);
    border-radius:20px;

    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);

    box-shadow:
        0 0 25px rgba(255,90,180,.08),
        inset 0 0 20px rgba(255,255,255,.02);
}


/* ÁNH SÁNG CHẠY THEO VIỀN - KHÔNG XOAY KHUNG */

@property --avatar-angle{
    syntax:"<angle>";
    initial-value:0deg;
    inherits:false;
}

/* VIỀN GỐC ĐỨNG YÊN */
#left-box::before{
    content:"";
    position:absolute;
    inset:-1px;
    border:1px solid rgba(255,170,220,.18);
    border-radius:22px;
    pointer-events:none;
    z-index:2;
}

/* CHỈ VỆT SÁNG CHẠY QUANH VIỀN — KHÔNG XOAY CARD */
#left-box::after{
    content:"";
    position:absolute;
    inset:-2px;
    border-radius:22px;
    padding:2px;

    background:
        conic-gradient(
            from var(--avatar-angle),
            transparent 0deg 315deg,
            rgba(240,147,251,.10) 325deg,
            rgba(240,147,251,.65) 337deg,
            rgba(255,255,255,1) 344deg,
            rgba(79,172,254,.75) 351deg,
            transparent 360deg
        );

    -webkit-mask:
        linear-gradient(#000 0 0) content-box,
        linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;
    mask:
        linear-gradient(#000 0 0) content-box,
        linear-gradient(#000 0 0);
    mask-composite:exclude;

    animation:avatarLightRun 2.8s linear infinite;

    pointer-events:none;
    z-index:3;

    filter:
        drop-shadow(0 0 5px rgba(240,147,251,.85))
        drop-shadow(0 0 12px rgba(79,172,254,.35));
}

@keyframes avatarLightRun{
    to{
        --avatar-angle:360deg;
    }
}

.avatar{
    width:90px;
    height:90px;

    border-radius:50%;
    object-fit:cover;

    border:2px solid rgba(255,255,255,.18);

    box-shadow:
        0 0 15px rgba(240,147,251,.35),
        0 0 35px rgba(79,172,254,.15);
}

.discord-name{
    margin-top:10px;
    font-size:14px;
    font-weight:700;
}

.discord-link{
    margin-top:5px;

    font-size:11px;
    color:#aaa;

    text-decoration:none;
}

.zzz{
    position:absolute;

    top:8px;
    right:18px;

    font-size:18px;
    opacity:.7;

    animation:zzz 2s ease-in-out infinite;
}

@keyframes zzz{
    0%,100%{
        transform:translateY(0);
        opacity:.45;
    }

    50%{
        transform:translateY(-7px);
        opacity:1;
    }
}


/* ================= SKILLS ================= */

#skills-box{
    order:2;

    width:min(720px,calc(100% - 10px));
    padding:15px 18px;

    background:rgba(10,8,18,.72);

    border:1px solid rgba(255,170,220,.2);
    border-radius:18px;

    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);

    box-shadow:
        0 0 25px rgba(255,90,180,.08),
        inset 0 0 20px rgba(255,255,255,.02);
}

.skills-title{
    text-align:center;

    font-size:13px;
    font-weight:800;

    letter-spacing:2px;

    margin-bottom:13px;
}

.skill-item{
    position:relative;

    display:grid;
    grid-template-columns:105px 1fr 42px;

    align-items:center;

    gap:12px;

    margin:10px 0;

    overflow:hidden;
}

.skill-name{
    font-size:11px;
    color:#ddd;
    white-space:nowrap;
}

.skill-percent{
    font-size:10px;
    text-align:right;
    color:#eee;
    font-weight:700;
}

.bar-wrapper{
    width:100%;
    height:8px;

    background:rgba(255,255,255,.07);

    border-radius:20px;

    overflow:hidden;

    box-shadow:
        inset 0 0 5px rgba(0,0,0,.5);
}

.bar-bg{
    width:100%;
    height:100%;
}


/* GIỮ MÀU CŨ */

.bar-fill{
    position:relative;

    height:100%;

    border-radius:20px;

    background:#f5576c;

    box-shadow:
        0 0 7px rgba(245,87,108,.55);

    overflow:hidden;
}


/* CHỈ THÊM TIA SÁNG */

.bar-fill::after{
    content:"";

    position:absolute;

    top:0;
    left:-45%;

    width:30%;
    height:100%;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.95),
            transparent
        );

    filter:blur(2px);

    animation:skillLight 2.4s linear infinite;
}

@keyframes skillLight{
    0%{
        left:-45%;
    }

    100%{
        left:120%;
    }
}

.python{width:90%}
.cpp{width:60%}
.js{width:80%}
.htmlcss{width:75%}
.sql{width:45%}
.bash{width:55%}


/* ================= 3D TEXT ================= */

.stage{
    order:3;

    position:relative;

    width:100%;
    height:210px;

    display:flex;
    align-items:center;
    justify-content:center;

    perspective:1100px;
    transform-style:preserve-3d;

    margin:10px 0 15px;

    z-index:5;
}

.ground-shadow{
    position:absolute;

    width:480px;
    height:80px;

    left:50%;
    top:62%;

    transform:
        translate(-50%,-50%)
        rotateX(70deg);

    background:
        radial-gradient(
            ellipse,
            rgba(150,70,220,.28),
            transparent 70%
        );

    filter:blur(20px);

    pointer-events:none;
}

.motion-glow{
    position:absolute;

    left:50%;
    top:50%;

    width:500px;
    height:170px;

    transform:
        translate(-50%,-50%);

    border-radius:50%;

    background:
        radial-gradient(
            ellipse,
            rgba(245,87,108,.45),
            rgba(240,147,251,.28) 35%,
            rgba(79,172,254,.18) 60%,
            transparent 75%
        );

    filter:blur(24px);

    opacity:.5;

    pointer-events:none;
    z-index:-1;
}

.cube-3d{
    position:absolute;

    left:50%;
    top:50%;

    width:max-content;
    height:max-content;

    transform:
        translate3d(-50%,-50%,0);

    transform-style:preserve-3d;

    cursor:grab;

    user-select:none;
    touch-action:none;
}

.cube-3d:active{
    cursor:grabbing;
}

.layer{
    position:absolute;

    left:0;
    top:0;

    font-size:clamp(70px,13vw,190px);

    font-weight:900;

    letter-spacing:-4px;
    line-height:1;

    white-space:nowrap;

    transform-style:preserve-3d;

    user-select:none;
}

.front-shine{
    background:
        linear-gradient(
            105deg,
            #f093fb 0%,
            #f5576c 28%,
            #ffffff 47%,
            #ffffff 53%,
            #4facfe 68%,
            #f093fb 100%
        );

    background-size:250% 100%;
    background-position:0% 50%;

    -webkit-background-clip:text;
    background-clip:text;

    color:transparent;

    filter:
        drop-shadow(0 0 7px rgba(255,150,220,.8))
        drop-shadow(0 0 18px rgba(130,100,255,.55));

    animation:textShine 3.2s linear infinite;
}

@keyframes textShine{
    0%{
        background-position:0% 50%;
    }

    100%{
        background-position:250% 50%;
    }
}


/* ================= DỊCH VỤ ================= */

#services{
    order:4;

    width:min(720px,calc(100% - 10px));

    padding:10px;

    display:grid;

    grid-template-columns:repeat(4,1fr);

    gap:8px;

    background:rgba(10,8,18,.76);

    border:1px solid rgba(255,170,220,.22);
    border-radius:18px;

    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);

    box-shadow:
        0 0 25px rgba(255,90,180,.1),
        inset 0 0 20px rgba(255,255,255,.02);
}

.service-item{
    min-width:0;

    padding:10px 5px;

    text-align:center;

    border:1px solid rgba(255,255,255,.1);
    border-radius:12px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.055),
            rgba(255,255,255,.015)
        );

    transition:
        transform .2s,
        border-color .2s,
        box-shadow .2s;
}

.service-item:hover{
    transform:translateY(-3px);

    border-color:rgba(255,170,220,.4);

    box-shadow:
        0 0 15px rgba(240,147,251,.15);
}

.service-title{
    font-size:12px;
    font-weight:800;

    color:#fff;

    margin-bottom:5px;
}

.service-desc{
    font-size:9px;

    line-height:1.3;

    color:#aaa;

    min-height:23px;
}

.service-status{
    margin-top:5px;

    font-size:9px;
    font-weight:700;

    color:#d7b5ff;
}


/* ================= MOBILE ================= */

@media(max-width:700px){

    #scene,
    #ui{
        min-height:145vh;
    }

    #ui{
        padding-top:22px;
        gap:22px;
    }

    .stage{
        height:170px;
        margin:5px 0 10px;
    }

    .layer{
        font-size:clamp(54px,15vw,100px);
        letter-spacing:-3px;
    }

    .motion-glow{
        width:340px;
        height:130px;
    }

    .ground-shadow{
        width:330px;
    }

    #skills-box{
        padding:13px 12px;
    }

    .skill-item{
        grid-template-columns:82px 1fr 35px;
        gap:8px;
        margin:9px 0;
    }

    .skill-name{
        font-size:10px;
    }

    .skill-percent{
        font-size:9px;
    }

    .bar-wrapper{
        height:7px;
    }

    #services{
        width:calc(100% - 10px);

        gap:5px;
        padding:7px;
    }

    .service-item{
        padding:9px 3px;
        border-radius:11px;
    }

    .service-title{
        font-size:9px;
    }

    .service-desc{
        font-size:7px;
    }

    .service-status{
        font-size:7px;
    }
}

@media(max-width:420px){

    #ui{
        padding-left:8px;
        padding-right:8px;
    }

    #left-box,
    #skills-box,
    #services{
        width:100%;
    }

    .skill-item{
        grid-template-columns:72px 1fr 32px;
        gap:7px;
    }

    .skill-name{
        font-size:9px;
    }

    .skill-percent{
        font-size:8px;
    }

    .service-item{
        padding:8px 2px;
    }

    .service-title{
        font-size:8px;
    }

    .service-desc,
    .service-status{
        font-size:6.5px;
    }
}
</style>
</head>


<body>

<div id="scene">

<canvas id="bg-canvas"></canvas>

<div id="ui">


<!-- ================= AVATAR ================= -->

<div id="left-box">

    <div class="zzz">Zzz...</div>

    <img
        class="avatar"
        src="https://cdn.discordapp.com/embed/avatars/0.png"

    >

    <div class="discord-name">

    </div>

    <a
        class="discord-link"

        </div>

        id="motionGlow"

<script>

/* =====================================================
   3D MUATHUCOEM
===================================================== */

const cube =
    document.getElementById("cube");

const motionGlow =
    document.getElementById("motionGlow");

const groundShadow =
    document.getElementById("groundShadow");

const TEXT = "Muathucoem";

const LAYERS = 12;
const DEPTH_STEP = 3.5;

let rotX = -8;
let rotY = -18;

let targetX = rotX;
let targetY = rotY;

let dragging = false;

let lastX = 0;
let lastY = 0;


/* tạo các lớp 3D */

for(let i = 0; i < LAYERS; i++){

    const layer =
        document.createElement("div");

    layer.className = "layer";

    layer.textContent = TEXT;

    layer.style.transform =
        `translateZ(${-i * DEPTH_STEP}px)`;

    layer.style.opacity =
        `${1 - i * .035}`;

    cube.appendChild(layer);
}


/* mặt trước */

const front =
    document.createElement("div");

front.className =
    "layer front-shine";

front.textContent =
    TEXT;

front.style.transform =
    "translateZ(2px)";

cube.appendChild(front);


/* căn kích thước chính xác */

function sizeCube(){
    cube.style.width = front.offsetWidth + "px";
    cube.style.height = front.offsetHeight + "px";
}

requestAnimationFrame(sizeCube);
window.addEventListener("resize",sizeCube,{passive:true});


/* animation 3D */

function update3D(){

    rotX +=
        (targetX - rotX) * .09;

    rotY +=
        (targetY - rotY) * .09;


    cube.style.transform =
        `translate3d(-50%,-50%,0)
         rotateX(${rotX}deg)
         rotateY(${rotY}deg)`;


    const rotationPower =
        Math.min(
            1,
            (
                Math.abs(targetX - rotX) +
                Math.abs(targetY - rotY)
            ) / 25
        );


    const glowScale =
        .8 + rotationPower * .55;

    const glowOpacity =
        .42 + rotationPower * .42;


    motionGlow.style.transform =
        `translate(-50%,-50%)
         scale(${glowScale})`;

    motionGlow.style.opacity =
        glowOpacity;


    motionGlow.style.filter =
        `blur(24px)
         hue-rotate(${rotY * .7}deg)`;


    groundShadow.style.transform =
        `translate(-50%,-50%)
         rotateX(70deg)
         scale(${1 + rotationPower * .15})`;


    requestAnimationFrame(update3D);
}

update3D();


/* =====================================================
   MOUSE
===================================================== */

window.addEventListener(
    "mousedown",
    e => {

        dragging = true;

        lastX = e.clientX;
        lastY = e.clientY;

    }
);


window.addEventListener(
    "mousemove",
    e => {

        if(!dragging) return;

        const dx =
            e.clientX - lastX;

        const dy =
            e.clientY - lastY;


        targetY +=
            dx * .35;

        targetX -=
            dy * .25;


        targetX =
            Math.max(
                -55,
                Math.min(55,targetX)
            );


        lastX =
            e.clientX;

        lastY =
            e.clientY;

    }
);


window.addEventListener(
    "mouseup",
    () => {
        dragging = false;
    }
);


/* =====================================================
   TOUCH
===================================================== */

window.addEventListener(
    "touchstart",
    e => {

        if(!e.touches.length) return;

        dragging = true;

        lastX =
            e.touches[0].clientX;

        lastY =
            e.touches[0].clientY;

    },
    {passive:true}
);


window.addEventListener(
    "touchmove",
    e => {

        if(
            !dragging ||
            !e.touches.length
        ) return;


        const x =
            e.touches[0].clientX;

        const y =
            e.touches[0].clientY;


        const dx =
            x - lastX;

        const dy =
            y - lastY;


        targetY +=
            dx * .35;

        targetX -=
            dy * .25;


        targetX =
            Math.max(
                -55,
                Math.min(55,targetX)
            );


        lastX = x;
        lastY = y;

    },
    {passive:true}
);


window.addEventListener(
    "touchend",
    () => {

        dragging = false;

    },
    {passive:true}
);


/* =====================================================
   DEVICE ORIENTATION
===================================================== */

window.addEventListener(
    "deviceorientation",
    e => {

        if(dragging) return;


        if(
            typeof e.gamma === "number"
        ){

            targetY =
                Math.max(
                    -35,
                    Math.min(35,e.gamma)
                );

        }


        if(
            typeof e.beta === "number"
        ){

            targetX =
                Math.max(
                    -30,
                    Math.min(
                        30,
                        -e.beta / 4
                    )
                );

        }

    },
    true
);


/* =====================================================
   BACKGROUND
===================================================== */

const canvas =
    document.getElementById(
        "bg-canvas"
    );

const ctx =
    canvas.getContext("2d");


let stars = [];
let fireflies = [];

function resizeCanvas(){
    const dpr = Math.min(window.devicePixelRatio || 1, 2);

    canvas.width = Math.floor(innerWidth * dpr);
    canvas.height = Math.floor(innerHeight * dpr);

    canvas.style.width = innerWidth + "px";
    canvas.style.height = innerHeight + "px";

    ctx.setTransform(dpr,0,0,dpr,0,0);

    createBackground();
}

function random(min,max){
    return Math.random() * (max - min) + min;
}

function createBackground(){
    stars = [];
    fireflies = [];

    const starCount = Math.min(
        170,
        Math.max(80, Math.floor(innerWidth * innerHeight / 7000))
    );

    for(let i = 0; i < starCount; i++){
        stars.push({
            x:Math.random() * innerWidth,
            y:Math.random() * innerHeight,
            r:random(.35,1.25),
            alpha:random(.25,.85),
            twinkle:random(.006,.018),
            phase:Math.random() * Math.PI * 2
        });
    }

    const fireflyCount = Math.min(
        32,
        Math.max(16, Math.floor(innerWidth / 18))
    );

    for(let i = 0; i < fireflyCount; i++){
        fireflies.push({
            x:Math.random() * innerWidth,
            y:Math.random() * innerHeight,
            r:random(.8,1.7),
            alpha:random(.35,.9),
            vx:random(-.18,.18),
            vy:random(-.12,.12),
            phase:Math.random() * Math.PI * 2,
            pulse:random(.012,.028),
            hue:Math.random() > .5 ? "rgba(240,147,251," : "rgba(120,170,255,"
        });
    }
}

function drawBackground(){
    ctx.clearRect(0,0,innerWidth,innerHeight);

    /* sao */
    for(const star of stars){
        star.phase += star.twinkle;

        const a =
            star.alpha *
            (.72 + Math.sin(star.phase) * .28);

        ctx.beginPath();
        ctx.arc(star.x,star.y,star.r,0,Math.PI*2);
        ctx.fillStyle = `rgba(255,255,255,${a})`;
        ctx.fill();
    }

    /* đom đóm — giữ hạt + quầng glow */
    for(const f of fireflies){
        f.phase += f.pulse;

        f.x += f.vx;
        f.y += f.vy;

        if(f.x < -20) f.x = innerWidth + 20;
        if(f.x > innerWidth + 20) f.x = -20;
        if(f.y < -20) f.y = innerHeight + 20;
        if(f.y > innerHeight + 20) f.y = -20;

        const pulse =
            f.alpha *
            (.55 + .45 * ((Math.sin(f.phase) + 1) / 2));

        /* quầng sáng mềm */
        const glow = ctx.createRadialGradient(
            f.x,f.y,0,
            f.x,f.y,22
        );

        glow.addColorStop(
            0,
            f.hue + (pulse * .75) + ")"
        );

        glow.addColorStop(
            .25,
            f.hue + (pulse * .30) + ")"
        );

        glow.addColorStop(
            1,
            f.hue + "0)"
        );

        ctx.fillStyle = glow;
        ctx.beginPath();
        ctx.arc(f.x,f.y,22,0,Math.PI*2);
        ctx.fill();

        /* lõi sáng */
        ctx.save();
        ctx.globalAlpha = pulse;
        ctx.shadowBlur = 14;
        ctx.shadowColor = f.hue + ".95)";
        ctx.fillStyle = "#fff";

        ctx.beginPath();
        ctx.arc(f.x,f.y,f.r,0,Math.PI*2);
        ctx.fill();

        ctx.restore();
    }

    requestAnimationFrame(drawBackground);
}

window.addEventListener("resize",resizeCanvas,{passive:true});

resizeCanvas();
drawBackground();

</script>
